[project]
name = "smartlearning-backend"
version = "0.1.0"
description = "Smart Knowledge Management & Interview Training Platform - Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "cryptography>=43.0",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "markdown-it-py>=3.0",
    "python-slugify>=8.0",
    "watchdog>=4.0",
    # Not win32-only: python:*-slim ships no system tz database either, so
    # zoneinfo lookups (and migration 0011, which seeds the tz catalog) fail in
    # the container. Bundling the PyPI copy makes it independent of the base image.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.0",
]
milvus = [
    "pymilvus>=2.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# `eval` is a dev-only harness, deliberately not part of the installed package
# (see include above), but tests/test_agent_routing_eval.py imports it. Locally
# it resolved by accident — an old-style editable install had put backend/ on
# sys.path. A clean `pip install -e .` does not, so state the dependency here.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the framework's idiom.
    # Debt from adopting lint on an existing codebase (CI would be red otherwise).
    # 121 long lines as of the first CI commit; see docs/ci-cd.md「Lint 欠账」.
    # Delete this line once they're reflowed — the gate then tightens by itself.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Imports must follow the sys.path bootstrap so the script runs from backend/.
"scripts/obsidian_sync_worker.py" = ["E402"]
