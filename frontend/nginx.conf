server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Don't advertise the nginx version to scanners.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /docs, /redoc and /openapi.json are deliberately NOT proxied: the API
    # schema shouldn't be reachable from the internet. For local schema access,
    # set SL_API_DOCS_ENABLED=true and hit the backend directly.

    # PWA caching. These use `expires` rather than `add_header Cache-Control`
    # because an add_header in a nested block replaces — not extends — the
    # server-level list, which would silently drop the security headers above.

    # Vite fingerprints these, so the content can never change under a given URL.
    location /assets/ {
        expires max;
    }

    # The worker and the shell must be revalidated on every launch, otherwise a
    # deploy never reaches a phone that already installed the app.
    location = /sw.js {
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    # nginx's bundled mime.types doesn't map .webmanifest in every build, and a
    # wrong Content-Type makes the install prompt disappear.
    location = /manifest.webmanifest {
        expires -1;
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

